name: 🔄 Restart Service

on:
  workflow_dispatch:

jobs:
  restart:
    name: "Restart Deployed Service"
    runs-on: ubuntu-latest
    steps:
      - name: Restart service via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_DEPLOY_KEY }}
          envs: SWARM_STACK
          script: |
            set -eu

            if [ -z "${SWARM_STACK:-}" ]; then
              echo "SWARM_STACK is not configured"
              exit 1
            fi

            services="$(docker stack services "$SWARM_STACK" --format '{{.Name}}')"
            if [ -z "$services" ]; then
              echo "No services found in stack: $SWARM_STACK"
              exit 1
            fi

            printf '%s\n' "$services" | xargs -r -n 1 docker service update --force
        env:
          SWARM_STACK: ${{ vars.SWARM_STACK }}
